name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Static, no database required — see scripts/assert-schema-rules.mjs.
      - name: Schema rules (ARCHITECTURE.md §7)
        run: pnpm schema:rules

      # docs/LEGAL.md §3 — banned outcome claims in user-facing text.
      - name: Advertising claims
        run: pnpm claims

      # docs/LEGAL.md §1 — YouTube may only be embedded via the nocookie player.
      - name: Embed rules
        run: pnpm embeds

      # Colour tokens used where they are not legible. The palette annotates
      # every ratio, but a comment does not stop anyone writing text-brand-500.
      - name: Contrast
        run: pnpm contrast

      # A committed .env.example must never contain a real credential.
      - name: Env templates
        run: pnpm env:templates

      # Applies migrations to an in-process Postgres and fires the triggers.
      # No Docker, so it runs in the fast job.
      - name: Simulate migrations
        run: pnpm db:simulate

      # The Data Analyst curriculum is the one course a cohort actually runs
      # on. This applies it to the simulated database twice: once to prove it
      # publishes all six weeks, once to prove re-running is a no-op. It also
      # asserts version 1 is left alone, since a student mid-sprint is reading
      # it. Offline — the reference results are committed, not fetched.
      - name: Data Analyst curriculum applies and re-applies
        run: pnpm courses:verify

      # Course proposals: one vote per browser, no voting for a real course,
      # and anon must never be able to read the votes table — voter_key is a
      # stable per-browser id, so readable rows would let anyone correlate
      # which courses one browser asked for.
      - name: Course proposal rules hold in the database
        run: pnpm proposals:verify

      # The landing page has an unauthenticated text box that writes to
      # Postgres. Every limit on it is one a stranger will eventually test, so
      # none of them live only in the form.
      - name: Course request limits hold in the database
        run: pnpm requests:verify

      # Enrolment is where a person becomes a student: session and 18+ gates,
      # the seat cap under a row lock, and RLS on who can read the result.
      - name: Enrolment rules hold in the database
        run: pnpm enrolment:verify

      # The catch-up bundle has to apply to the project as it actually is —
      # part-migrated, with real rows — not to an empty database.
      - name: Catch-up bundle applies to the live shape
        run: pnpm catchup:verify

      # Deno resolves nothing without a file extension, and the rest of the repo
      # is deliberately extensionless. Caught statically here rather than by the
      # Docker job failing five minutes later.
      - name: Edge function imports resolve
        run: pnpm fn:imports

      # Every guard must have a script and a CI step. Merges keep dropping them.
      - name: Guards are wired
        run: pnpm guards

  database:
    name: migrations · schema guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Applies every migration to a real Postgres. The static checker reads
      # SQL text; this proves the database actually did what we asked.
      - name: Start local Supabase
        run: pnpm supabase start

      - name: Assert schema guarantees
        run: pnpm db:verify

      - name: Lint schema
        run: pnpm db:lint

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop --no-backup
