class Component extends DCLogic {
componentDidMount() {

}
componentWillUnmount() {
clearInterval(this._t);
}
count() {
var self = this;
var still = false;
try { still = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
clearInterval(this._t);
if (still) { this.setState({ pts: 25 }); return; }
var n = 0;
this.setState({ pts: 0 });
this._t = setInterval(function () {
n += 1;
self.setState({ pts: n });
if (n >= 25) { clearInterval(self._t); }
}, 36);
}
renderVals() {
var self = this;
var st = this.state || {};
var run = st.run || 0;
return {
v: run % 2 === 0 ? 'A' : 'B',
pts: st.pts === undefined ? 25 : st.pts,
replay: function () {
self.setState({ run: run + 1 });
self.count();
}
};
}
