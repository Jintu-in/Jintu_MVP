<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step to step, interactive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0B5567}a:hover{color:#0A3B46}
@keyframes slideA { 0% { transform: translateX(28px); opacity: 0 } 100% { transform: translateX(0); opacity: 1 } }
@keyframes slideB { 0% { transform: translateX(28px); opacity: 0 } 100% { transform: translateX(0); opacity: 1 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #EEF3F3; color: #0C2A30; font-family: Figtree, system-ui, sans-serif">

<div style="height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 12px">
<a href="V2Block.dc.html" aria-label="Back to Git and GitHub" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; color: #0C2A30">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="font-size: 15px; line-height: 20px; font-weight: 600">Lesson 1</div>
<div style="font-size: 12.5px; line-height: 18px; color: #5E777D">Git &amp; GitHub</div>
</div>
<div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 16px; background: #FFFFFF; font: 500 12.5px/1 'JetBrains Mono', ui-monospace, monospace; color: #0C2A30">{{count}}</div>
</div>

<div style="flex: none; display: flex; gap: 4px; padding: 0 20px" role="img" aria-label="{{progressLabel}}">
<sc-for list="{{ pills }}" as="pill" hint-placeholder-count="8">
<div style="flex: 1; height: 6px; border-radius: 3px; background: {{pill.bg}}; transition: background 320ms ease-out"></div>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 24px 20px 0">
<div style="display: flex; flex-direction: column; gap: 16px; animation: slide{{v}} 360ms ease-out both">

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; line-height: 18px; font-weight: 600; color: #0B5567">{{stepLabel}}</div>
<h1 style="margin: 0; font: 600 28px/32px 'Bricolage Grotesque', Figtree, system-ui, sans-serif; letter-spacing: -0.015em">{{title}}</h1>
</div>

<div style="display: flex; flex-direction: column; padding: 12px 12px 18px 16px; border-radius: 20px; background: #0A1F24; box-shadow: 0 1px 2px rgba(12,42,48,0.12), 0 12px 28px rgba(12,42,48,0.18)">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="font: 500 11px/16px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #7FA9B2">Type this</div>
<button onClick="{{ copy }}" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 12px; background: {{copyBg}}; color: {{copyFg}}; font: 600 13.5px/1 Figtree, system-ui, sans-serif; cursor: pointer; transition: background 160ms ease-out, color 160ms ease-out">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
<span>{{copyLabel}}</span>
</button>
</div>
<div style="margin-top: 8px; display: flex; flex-direction: column; gap: 2px; font: 500 14px/22px 'JetBrains Mono', ui-monospace, monospace; color: #FFFFFF; overflow-wrap: anywhere">
<sc-for list="{{ cmds }}" as="cmd" hint-placeholder-count="1">
<div style="display: flex; gap: 10px"><span aria-hidden="true" style="flex: none; color: #43B4C8">$</span><span style="min-width: 0">{{cmd.text}}</span></div>
</sc-for>
</div>
<div style="height: 1px; margin: 14px 4px 14px 0; background: rgba(255,255,255,0.12)"></div>
<div style="font: 500 11px/16px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #7FA9B2">You should see</div>
<div style="margin-top: 8px; padding-right: 4px; display: flex; flex-direction: column; font: 400 12px/19px 'JetBrains Mono', ui-monospace, monospace; overflow-wrap: anywhere">
<sc-for list="{{ lines }}" as="line" hint-placeholder-count="6">
<div style="min-height: {{line.h}}px; margin: {{line.m}}; padding: {{line.p}}; border-radius: 8px; background: {{line.bg}}; color: {{line.fg}}; font-weight: {{line.w}}">{{line.text}}</div>
</sc-for>
</div>
</div>

<div style="padding: 14px 16px; border-radius: 16px; background: #FFFFFF; font-size: 15px; line-height: 22px">{{note}}</div>

</div>
</div>

<div style="flex: none; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #DCE6E7">
<button onClick="{{ next }}" style="width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 16px; background: #43B4C8; color: #06262C; font: 600 16.5px/1 Figtree, system-ui, sans-serif; cursor: pointer">
<span>{{btn}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentWillUnmount() {
clearTimeout(this._c);
}
renderVals() {
var self = this;
var st = this.state || {};
var i = st.i || 0;
var copied = !!st.copied;
function line(text, kind) {
if (kind === 'gap') { return { text: '', h: 8, m: '0', p: '0', bg: 'transparent', fg: '#A9C7CD', w: 400 }; }
if (kind === 'mark') { return { text: text, h: 19, m: '3px 0 3px -8px', p: '3px 8px', bg: 'rgba(67,180,200,0.24)', fg: '#FFFFFF', w: 500 }; }
if (kind === 'in') { return { text: text, h: 19, m: '0', p: '0 0 0 14px', bg: 'transparent', fg: '#A9C7CD', w: 400 }; }
return { text: text, h: 19, m: '0', p: '0', bg: 'transparent', fg: '#A9C7CD', w: 400 };
}
var steps = [
{
n: 5,
title: 'Ask Git what it sees',
cmds: ['git status'],
lines: [
line('On branch main'), line('', 'gap'), line('No commits yet'), line('', 'gap'),
line('Untracked files:'),
line('(use "git add <file>..." to include in what will be committed)', 'in'),
line('README.md', 'mark'), line('', 'gap'),
line('nothing added to commit but untracked files present (use "git add" to track)')
],
note: '"Untracked" means Git can see the file but is not recording it yet.'
},
{
n: 6,
title: 'Choose the file, then look again',
cmds: ['git add README.md', 'git status'],
lines: [
line('On branch main'), line('', 'gap'), line('No commits yet'), line('', 'gap'),
line('Changes to be committed:'),
line('(use "git rm --cached <file>..." to unstage)', 'in'),
line('new file:   README.md', 'mark')
],
note: 'git add chose what goes into the commit. Nothing is saved yet.'
},
{
n: 7,
title: 'Save the version with a message',
cmds: ['git commit -m "Add README with project title"'],
lines: [
line('[main (root-commit) 4e230e0] Add README with project title', 'mark'),
line('1 file changed, 1 insertion(+)', 'in'),
line('create mode 100644 README.md', 'in')
],
note: 'The code 4e230e0 is this version’s ID. Yours will be different.'
}
];
var cur = steps[i];
var pills = [];
for (var k = 1; k <= 8; k += 1) {
pills.push({ bg: k < cur.n ? '#0A3B46' : (k === cur.n ? '#43B4C8' : '#D3DFE1') });
}
return {
v: i % 2 === 0 ? 'A' : 'B',
count: cur.n + ' / 8',
progressLabel: (cur.n - 1) + ' of 8 steps done',
stepLabel: 'Step ' + cur.n,
title: cur.title,
cmds: cur.cmds.map(function (c) { return { text: c }; }),
lines: cur.lines,
note: cur.note,
btn: i === 2 ? 'I see this. Play again' : 'I see this',
pills: pills,
copyLabel: copied ? 'Copied' : 'Copy',
copyBg: copied ? '#43B4C8' : 'rgba(255,255,255,0.1)',
copyFg: copied ? '#06262C' : '#FFFFFF',
next: function () {
clearTimeout(self._c);
self.setState({ i: (i + 1) % 3, copied: false });
},
copy: function () {
try {
var p = navigator.clipboard.writeText(cur.cmds.join('\n'));
if (p && p.catch) { p.catch(function () {}); }
} catch (e) {}
self.setState({ copied: true });
clearTimeout(self._c);
self._c = setTimeout(function () { self.setState({ copied: false }); }, 1400);
}
};
}
}
</script>
</body>
</html>
