<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First run, pick a goal, on desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0B5567}a:hover{color:#0A3B46}

</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; box-sizing: border-box; display: flex; background: #EEF3F3; color: #0C2A30; font-family: Figtree, system-ui, sans-serif; ">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="height: 88px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 48px">
<div style="width: 160px; display: flex"><a href="DeskHome.dc.html" style="display: flex; align-items: center; gap: 10px; height: 48px; text-decoration: none; color: #0C2A30; font: 600 22px/1 'Bricolage Grotesque', Figtree, system-ui, sans-serif; letter-spacing: -0.01em">
<span aria-hidden="true" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #43B4C8; color: #06262C; font: 700 17px/1 'Bricolage Grotesque', Figtree, system-ui, sans-serif">j</span>
<span>jintu</span>
</a></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="display: flex; gap: 6px" role="img" aria-label="Question 1 of 2"><span style="width: 56px; height: 6px; border-radius: 3px; background: #0A3B46"></span><span style="width: 56px; height: 6px; border-radius: 3px; background: #D3DFE1"></span></span><span style="font: 400 13px/18px 'JetBrains Mono', ui-monospace, monospace; color: #5E777D">1 of 2</span></div>
<div style="width: 160px; display: flex; justify-content: flex-end"><a href="DeskNew.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; font-weight: 600; text-decoration: none">Skip</a></div>
</div>
<div style="flex: 1; min-height: 0; display: flex; justify-content: center; padding: 56px 48px 0; overflow: hidden">
<div style="width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font: 700 48px/52px 'Bricolage Grotesque', Figtree, system-ui, sans-serif; letter-spacing: -0.03em">What do you want to become?</h1>
<p style="margin: 0; font-size: 18px; line-height: 28px; color: #45626A">Pick the closest one. You can change it any time.</p>
</div>
<div role="radiogroup" aria-label="Where you are now" style="align-self: flex-start; display: flex; gap: 2px; padding: 4px; border-radius: 28px; background: #FFFFFF">
<sc-for list="{{ segs }}" as="seg" hint-placeholder-count="3">
<button role="radio" aria-checked="{{seg.on}}" onClick="{{ seg.pick }}" style="height: 48px; padding: 0 24px; border: 0; border-radius: 24px; background: {{seg.bg}}; color: {{seg.fg}}; font: {{seg.w}} 15px/1 Figtree, system-ui, sans-serif; cursor: pointer; transition: background 160ms ease-out, color 160ms ease-out">{{seg.name}}</button>
</sc-for>
</div>
<div role="radiogroup" aria-label="Goal" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ roles }}" as="role" hint-placeholder-count="6">
<button role="radio" aria-checked="{{role.on}}" onClick="{{ role.pick }}" style="min-height: 76px; box-sizing: border-box; padding: 10px 18px; border: 1.5px solid {{role.ring}}; border-radius: 22px; background: {{role.bg}}; color: {{role.fg}}; font: {{role.w}} 16.5px/22px Figtree, system-ui, sans-serif; text-align: left; cursor: pointer; transition: background 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out">{{role.name}}</button>
</sc-for>
</div>
<div style="min-height: 128px; display: flex; flex-direction: column">
<sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; border-radius: 22px; background: #FFFFFF">
<label for="dgoal-own" style="font-size: 14px; line-height: 20px; font-weight: 600">Your goal, in your words</label>
<div style="display: flex; align-items: center; gap: 16px">
<input id="dgoal-own" type="text" placeholder="Journalist, IAS officer, history teacher" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #0B5567; border-radius: 16px; background: #FFFFFF; color: #0C2A30; font: 400 16px/1 Figtree, system-ui, sans-serif">
<div style="width: 300px; flex: none; font-size: 14px; line-height: 20px; color: #45626A">No path for it yet? We note the request and tell you when one opens.</div>
</div>
</div>
</sc-if>
<sc-if value="{{ notTyping }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ own }}" style="align-self: flex-start; height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 26px; border: 1.5px dashed #9FB6BA; border-radius: 22px; background: transparent; color: #0C2A30; font: 600 15.5px/1 Figtree, system-ui, sans-serif; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
<span>Type in my own</span>
</button>
</sc-if>
</div>
<div style="display: flex; justify-content: flex-end">
<a href="DeskNeed.dc.html" style="min-width: 240px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 28px; border-radius: 16px; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 16.5px; font-weight: 600; text-decoration: none; transition: background 160ms ease-out, color 160ms ease-out"><span>{{cta}}</span></a>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var st = this.state || {};
var seg = st.seg || 'study';
var picked = st.picked === undefined ? 'Associate software engineer' : st.picked;
var typing = !!st.typing;
var groups = {
study: { name: 'Studying', flex: 1, roles: ['Associate software engineer', 'Data analyst', 'Business analyst', 'Financial analyst', 'Associate product manager', 'UX designer'] },
work: { name: 'Working', flex: 1, roles: ['Backend engineer', 'Product manager', 'Data engineer', 'Engineering manager', 'Growth marketer', 'FP&A analyst'] },
build: { name: 'Building something', flex: 1.6, roles: ['Founder', 'Performance marketer', 'Startup finance lead / CFO', 'Brand manager', 'Revenue operations', 'Content marketer'] }
};
var ready = typing || !!picked;
return {
typing: typing,
notTyping: !typing,
segs: ['study', 'work', 'build'].map(function (k) {
var on = k === seg;
return {
name: groups[k].name,
flex: groups[k].flex,
on: on ? 'true' : 'false',
bg: on ? '#0A3B46' : 'transparent',
fg: on ? '#FFFFFF' : '#45626A',
w: on ? 600 : 500,
pick: function () { self.setState({ seg: k, picked: '', typing: false }); }
};
}),
roles: groups[seg].roles.map(function (r) {
var on = !typing && r === picked;
return {
name: r,
on: on ? 'true' : 'false',
bg: on ? '#0A3B46' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#0C2A30',
ring: on ? '#0A3B46' : '#C5D5D8',
w: on ? 600 : 500,
pick: function () { self.setState({ picked: r, typing: false }); }
};
}),
own: function () { self.setState({ typing: true, picked: '' }); },
cta: ready ? 'Continue' : 'Pick one to continue',
ctaBg: ready ? '#43B4C8' : '#D3DFE1',
ctaFg: ready ? '#06262C' : '#45626A'
};
}
}
</script>
</body>
</html>
