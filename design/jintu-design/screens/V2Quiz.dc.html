<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick check after a lesson</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0B5567}a:hover{color:#0A3B46}
@keyframes inA { 0% { transform: translateY(10px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }
@keyframes inB { 0% { transform: translateY(10px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }
@keyframes shake { 0% { transform: translateX(0) } 20% { transform: translateX(-7px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } 100% { transform: translateX(0) } }
@keyframes bump { 0% { transform: scale(1) } 45% { transform: scale(1.035) } 100% { transform: scale(1) } }
@keyframes fb { 0% { transform: translateY(10px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }
@keyframes tag { 0% { transform: scale(0.4); opacity: 0 } 60% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #EEF3F3; color: #0C2A30; font-family: Figtree, system-ui, sans-serif">

<div style="height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 12px">
<a href="V2Questions.dc.html" aria-label="Back to the lesson" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; color: #0C2A30">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="font-size: 15px; line-height: 20px; font-weight: 600">Quick check</div>
<div style="font-size: 12.5px; line-height: 18px; color: #5E777D">Lesson 1 · no score is kept</div>
</div>
<div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 16px; background: #FFFFFF; font: 500 12.5px/1 'JetBrains Mono', ui-monospace, monospace; color: #0C2A30">{{count}}</div>
</div>

<div style="flex: none; display: flex; gap: 4px; padding: 0 20px" role="img" aria-label="{{progressLabel}}">
<sc-for list="{{ pills }}" as="pill" hint-placeholder-count="3">
<div style="flex: 1; height: 6px; border-radius: 3px; background: {{pill.bg}}; transition: background 320ms ease-out"></div>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 28px 20px 0">
<div style="display: flex; flex-direction: column; gap: 18px; animation: in{{v}} 300ms ease-out both">

<h1 style="margin: 0; font: 600 24px/30px 'Bricolage Grotesque', Figtree, system-ui, sans-serif; letter-spacing: -0.015em; text-wrap: balance">{{question}}</h1>

<div role="radiogroup" aria-label="Answers" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ options }}" as="opt" hint-placeholder-count="4">
<button role="radio" aria-checked="{{opt.on}}" onClick="{{ opt.pick }}" style="min-height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; border: 2px solid {{opt.ring}}; border-radius: 20px; background: {{opt.bg}}; color: {{opt.fg}}; font: 500 15px/21px {{opt.font}}; text-align: left; cursor: pointer; transition: background 160ms ease-out, border-color 160ms ease-out; animation: {{opt.anim}}">
<span style="min-width: 0">{{opt.text}}</span>
<span aria-hidden="true" style="flex: none; font: 600 13px/1 Figtree, system-ui, sans-serif; animation: {{opt.tagAnim}}">{{opt.tag}}</span>
</button>
</sc-for>
</div>

<sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 20px; background: {{fbBg}}; color: {{fbFg}}; animation: fb 280ms ease-out 140ms both">
<div style="font-size: 15.5px; line-height: 22px; font-weight: 600">{{fbTitle}}</div>
<div style="font-size: 14.5px; line-height: 21px">{{fbText}}</div>
</div>
</sc-if>

</div>
</div>

<div style="flex: none; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #DCE6E7">
<button onClick="{{ next }}" style="width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 16px; background: {{ctaBg}}; color: {{ctaFg}}; font: 600 16.5px/1 Figtree, system-ui, sans-serif; cursor: pointer; transition: background 160ms ease-out, color 160ms ease-out">{{cta}}</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var st = this.state || {};
var i = st.i || 0;
var pick = st.pick === undefined ? -1 : st.pick;
var qs = [
{
q: 'Which command chooses what goes into the next commit?',
mono: true,
opts: ['git init', 'git add', 'git commit', 'git status'],
right: 1,
why: 'git add chooses. git commit then saves what you chose, with a message.'
},
{
q: 'Where does Git keep every version you have saved?',
mono: false,
opts: ['On GitHub', 'In the .git folder inside your project', 'In your Downloads folder'],
right: 1,
why: 'git init created that hidden folder. Nothing has left your computer yet.'
},
{
q: 'You are not sure what to do next. Which command do you run?',
mono: true,
opts: ['git log --oneline', 'git config --global user.name', 'git status'],
right: 2,
why: 'git status tells you what Git sees and often suggests the next command.'
}
];
var cur = qs[i];
var answered = pick >= 0;
var correct = pick === cur.right;
var pills = qs.map(function (q, k) { return { bg: k < i ? '#0A3B46' : (k === i ? '#43B4C8' : '#D3DFE1') }; });
return {
v: i % 2 === 0 ? 'A' : 'B',
count: (i + 1) + ' / ' + qs.length,
progressLabel: 'Question ' + (i + 1) + ' of ' + qs.length,
pills: pills,
question: cur.q,
answered: answered,
options: cur.opts.map(function (text, k) {
var isRight = answered && k === cur.right;
var isWrongPick = answered && k === pick && !correct;
return {
text: text,
font: cur.mono ? "'JetBrains Mono', ui-monospace, monospace" : 'Figtree, system-ui, sans-serif',
on: k === pick ? 'true' : 'false',
bg: isRight ? '#DDF4EA' : (isWrongPick ? '#FBE7E1' : '#FFFFFF'),
ring: isRight ? '#1E9E6E' : (isWrongPick ? '#C4532F' : '#FFFFFF'),
fg: isRight ? '#0B4A32' : (isWrongPick ? '#7A2A12' : '#0C2A30'),
tag: isRight ? 'Right' : (isWrongPick ? 'Not this one' : ''),
anim: isWrongPick ? 'shake 380ms ease-in-out' : (isRight ? 'bump 360ms ease-out ' + (correct ? '0ms' : '220ms') : 'none'),
tagAnim: isRight || isWrongPick ? 'tag 320ms cubic-bezier(0.2, 1.3, 0.4, 1) both' : 'none',
pick: function () { if (!answered) { self.setState({ pick: k }); } }
};
}),
fbBg: correct ? '#DDF4EA' : '#FFF1D1',
fbFg: correct ? '#0B4A32' : '#3D2600',
fbTitle: correct ? 'That is it.' : 'Close. Here is the idea.',
fbText: cur.why,
cta: !answered ? 'Pick an answer' : (i === qs.length - 1 ? 'Done' : 'Next question'),
ctaBg: answered ? '#43B4C8' : '#D3DFE1',
ctaFg: answered ? '#06262C' : '#45626A',
next: function () {
if (!answered) { return; }
self.setState({ i: (i + 1) % qs.length, pick: -1 });
}
};
}
}
</script>
</body>
</html>
