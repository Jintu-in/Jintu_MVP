<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.count();
}
componentWillUnmount() {
clearInterval(this._t);
}
count() {
var self = this;
var still = false;
try { still = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
clearInterval(this._t);
if (still) { this.setState({ k: 30 }); return; }
var k = 0;
this.setState({ k: 0 });
this._t = setInterval(function () {
k += 1;
self.setState({ k: k });
if (k >= 30) { clearInterval(self._t); }
}, 34);
}
renderVals() {
var self = this;
var st = this.state || {};
var run = st.run || 0;
var k = st.k === undefined ? 30 : st.k;
var v = run % 2 === 0 ? 'A' : 'B';
var week = [['M', 'off'], ['T', 'off'], ['W', 'done'], ['T', 'done'], ['F', 'done'], ['S', 'today'], ['S', 'off']];
var done = 0;
var days = week.map(function (d) {
var kind = d[1];
var anim = 'none';
if (kind === 'done') {
anim = 'pop' + v + ' 440ms cubic-bezier(0.2, 1.3, 0.4, 1) ' + (360 + done * 130) + 'ms both';
done += 1;
}
if (kind === 'today') { anim = 'ring 1.8s ease-out 1300ms infinite'; }
return {
l: d[0],
w: kind === 'today' ? 500 : 400,
fg: kind === 'today' ? '#FFFFFF' : '#8FBAC3',
bg: kind === 'done' ? '#FFB627' : (kind === 'today' ? 'transparent' : 'rgba(255,255,255,0.08)'),
border: kind === 'today' ? '2px dashed #FFB627' : '0 solid transparent',
tick: kind === 'done' ? 1 : 0,
anim: anim
};
});
var bars = [];
for (var i = 0; i < 12; i += 1) {
bars.push({
bg: i < 3 ? '#0A3B46' : (i === 3 ? '#43B4C8' : 'transparent'),
anim: i < 4 ? 'fill' + v + ' 300ms ease-out ' + (520 + i * 150) + 'ms both' : 'none'
});
}
return {
v: v,
streak: Math.min(3, Math.floor(k / 7)),
pts: Math.round(75 * k / 30),
days: days,
bars: bars,
replay: function () {
self.setState({ run: run + 1 });
self.count();
}
};
}
}
</script>
