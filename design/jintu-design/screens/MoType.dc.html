<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson step, watch it run first</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0B5567}a:hover{color:#0A3B46}
@keyframes blink { 0% { opacity: 1 } 49% { opacity: 1 } 50% { opacity: 0 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #EEF3F3; color: #0C2A30; font-family: Figtree, system-ui, sans-serif">

<div style="height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 12px">
<a href="MoPath.dc.html" aria-label="Back to Git and GitHub" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; color: #0C2A30">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="font-size: 15px; line-height: 20px; font-weight: 600">Lesson 1</div>
<div style="font-size: 12.5px; line-height: 18px; color: #5E777D">Git &amp; GitHub</div>
</div>
<div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 16px; background: #FFFFFF; font: 500 12.5px/1 'JetBrains Mono', ui-monospace, monospace; color: #0C2A30">5 / 8</div>
</div>

<div style="flex: none; display: flex; gap: 4px; padding: 0 20px" role="img" aria-label="4 of 8 steps done">
<div style="flex: 1; height: 6px; border-radius: 3px; background: #0A3B46"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #0A3B46"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #0A3B46"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #0A3B46"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #43B4C8"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #D3DFE1"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #D3DFE1"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #D3DFE1"></div>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px 0">

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; line-height: 18px; font-weight: 600; color: #0B5567">Step 5</div>
<h1 style="margin: 0; font: 600 28px/32px 'Bricolage Grotesque', Figtree, system-ui, sans-serif; letter-spacing: -0.015em">Ask Git what it sees</h1>
</div>

<div style="display: flex; flex-direction: column; padding: 12px 12px 18px 16px; border-radius: 20px; background: #0A1F24; box-shadow: 0 1px 2px rgba(12,42,48,0.12), 0 12px 28px rgba(12,42,48,0.18)">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="font: 500 11px/16px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #7FA9B2">{{head}}</div>
<button onClick="{{ replay }}" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 12px; background: rgba(255,255,255,0.1); color: #FFFFFF; font: 600 13.5px/1 Figtree, system-ui, sans-serif; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.500-5.800"></path><path d="M4 4v4.500h4.500"></path></svg>
<span>Watch again</span>
</button>
</div>
<div style="margin-top: 8px; min-height: 22px; display: flex; align-items: center; gap: 10px; font: 500 14px/22px 'JetBrains Mono', ui-monospace, monospace; color: #FFFFFF">
<span aria-hidden="true" style="flex: none; color: #43B4C8">$</span>
<span aria-label="git status">{{typed}}</span>
<span aria-hidden="true" style="display: flex; margin-left: -6px; opacity: {{caretO}}; transition: opacity 120ms ease-out"><span style="width: 8px; height: 17px; border-radius: 2px; background: #43B4C8; animation: blink 900ms linear infinite"></span></span>
</div>
<div style="height: 1px; margin: 14px 4px 14px 0; background: rgba(255,255,255,0.12)"></div>
<div style="font: 500 11px/16px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #7FA9B2">You should see</div>
<div style="margin-top: 8px; padding-right: 4px; display: flex; flex-direction: column; font: 400 12px/19px 'JetBrains Mono', ui-monospace, monospace; overflow-wrap: anywhere">
<sc-for list="{{ lines }}" as="line" hint-placeholder-count="9">
<div style="min-height: {{line.h}}px; margin: {{line.m}}; padding: {{line.p}}; border-radius: 8px; background-color: {{line.bg}}; color: {{line.fg}}; font-weight: {{line.w}}; opacity: {{line.o}}; transform: {{line.t}}; transition: opacity 180ms ease-out, transform 180ms ease-out, background-color 500ms ease-out 120ms, color 300ms ease-out 120ms">{{line.text}}</div>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; font-size: 15px; line-height: 22px; opacity: {{noteO}}; transform: {{noteT}}; transition: opacity 320ms ease-out, transform 320ms ease-out">
<span aria-hidden="true" style="flex: none; height: 22px; display: flex; align-items: center; padding: 0 8px; border-radius: 11px; background: #DDF3F7; color: #0B5567; font-size: 11.5px; font-weight: 600">look for this</span>
<span style="min-width: 0">"Untracked" means Git can see the file but is not recording it yet.</span>
</div>

</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #DCE6E7">
<div style="font-size: 13.5px; line-height: 20px; color: #45626A">{{hint}}</div>
<a href="MoRepo.dc.html" aria-disabled="{{off}}" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 16.5px; font-weight: 600; text-decoration: none; transform: {{ctaT}}; transition: background 240ms ease-out, color 240ms ease-out, transform 320ms cubic-bezier(0.2, 1.4, 0.4, 1)">
<span>I see this</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.play();
}
componentWillUnmount() {
clearInterval(this._t);
}
play() {
var self = this;
var still = false;
try { still = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
clearInterval(this._t);
if (still) { this.setState({ k: 99 }); return; }
var k = 0;
this.setState({ k: 0 });
this._t = setInterval(function () {
k += 1;
self.setState({ k: k });
if (k >= 46) { clearInterval(self._t); }
}, 70);
}
renderVals() {
var self = this;
var st = this.state || {};
var k = st.k === undefined ? 99 : st.k;
var cmd = 'git status';
var TYPE_START = 6;
var typedN = Math.max(0, Math.min(cmd.length, k - TYPE_START));
var OUT_START = TYPE_START + cmd.length + 6;
var raw = [
['On branch main', ''], ['', 'gap'], ['No commits yet', ''], ['', 'gap'],
['Untracked files:', ''],
['(use "git add <file>..." to include in what will be committed)', 'in'],
['README.md', 'mark'], ['', 'gap'],
['nothing added to commit but untracked files present (use "git add" to track)', '']
];
var shownN = Math.max(0, Math.min(raw.length, Math.floor((k - OUT_START) / 2) + 1));
if (k < OUT_START) { shownN = 0; }
var allOut = shownN >= raw.length;
var done = k >= OUT_START + raw.length * 2 + 4;
var lines = raw.map(function (r, i) {
var kind = r[1];
var on = i < shownN;
var lit = kind === 'mark' && allOut;
return {
text: r[0],
h: kind === 'gap' ? 8 : 19,
m: kind === 'mark' ? '3px 0 3px -8px' : '0',
p: kind === 'mark' ? '3px 8px' : (kind === 'in' ? '0 0 0 14px' : '0'),
bg: lit ? 'rgba(67,180,200,0.24)' : 'rgba(67,180,200,0)',
fg: lit ? '#FFFFFF' : '#A9C7CD',
w: kind === 'mark' ? 500 : 400,
o: on ? 1 : 0,
t: on ? 'translateY(0)' : 'translateY(6px)'
};
});
return {
head: done ? 'Now type it yourself' : 'Watch it run',
typed: cmd.slice(0, typedN),
caretO: shownN > 0 ? 0 : 1,
lines: lines,
noteO: done ? 1 : 0,
noteT: done ? 'translateY(0)' : 'translateY(12px)',
hint: done ? 'Run it on your computer, then compare.' : 'Watch the example first.',
off: done ? 'false' : 'true',
ctaBg: done ? '#43B4C8' : '#D3DFE1',
ctaFg: done ? '#06262C' : '#45626A',
ctaT: done ? 'scale(1)' : 'scale(0.97)',
replay: function () { self.play(); }
};
}
}
</script>
</body>
</html>
