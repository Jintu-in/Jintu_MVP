<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First run, what you need most</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0B5567}a:hover{color:#0A3B46}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #EEF3F3; color: #0C2A30; font-family: Figtree, system-ui, sans-serif">

<div style="height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 12px">
<a href="V2Goal.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; color: #0C2A30">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="font: 400 12.5px/18px 'JetBrains Mono', ui-monospace, monospace; color: #5E777D">2 of 2</div>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 4px 20px 0">

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font: 700 30px/34px 'Bricolage Grotesque', Figtree, system-ui, sans-serif; letter-spacing: -0.02em; text-wrap: balance">What do you need most right now?</h1>
<p style="margin: 0; font-size: 15.5px; line-height: 23px; color: #45626A">One answer. It decides what your home screen shows first.</p>
</div>

<div role="radiogroup" aria-label="What you need most" style="flex: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ needs }}" as="need" hint-placeholder-count="4">
<button role="radio" aria-checked="{{need.on}}" onClick="{{ need.pick }}" style="min-height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border: 2px solid {{need.ring}}; border-radius: 22px; background: #FFFFFF; color: #0C2A30; text-align: left; cursor: pointer; transition: border-color 160ms ease-out">
<span aria-hidden="true" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: {{need.dot}}; color: {{need.dotFg}}; font: 600 16px/1 'JetBrains Mono', ui-monospace, monospace; transition: background 160ms ease-out, color 160ms ease-out">{{need.mark}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font: 600 16px/22px Figtree, system-ui, sans-serif">{{need.title}}</span>
<span style="font: 400 13.5px/19px Figtree, system-ui, sans-serif; color: #45626A">{{need.gives}}</span>
</span>
</button>
</sc-for>
</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 20px; background: #DDF3F7; color: #0A3B46">
<div style="font-size: 13px; line-height: 18px; font-weight: 600; color: #0B5567">Your home screen will open on</div>
<div style="font: 600 18px/24px 'Bricolage Grotesque', Figtree, system-ui, sans-serif; letter-spacing: -0.01em">{{opens}}</div>
</div>

</div>

<div style="flex: none; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #DCE6E7">
<a href="V2New.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: #43B4C8; color: #06262C; font-size: 16.5px; font-weight: 600; text-decoration: none">
<span>Finish</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var st = this.state || {};
var cur = st.need || 'start';
var items = [
{ k: 'start', mark: '1', title: 'Tell me where to start', gives: 'One path, in order', opens: 'Your path, with the first lesson ready' },
{ k: 'finish', mark: '2', title: 'Help me finish what I start', gives: 'A streak and one reminder a day', opens: 'Your streak and this week' },
{ k: 'time', mark: '3', title: 'Fit it into 15 minutes', gives: 'Short lessons, one step at a time', opens: 'Today, one 15-minute lesson' },
{ k: 'show', mark: '4', title: 'Something to show for it', gives: 'A profile and cards you can share', opens: 'Your profile and share card' }
];
var chosen = items[0];
items.forEach(function (it) { if (it.k === cur) { chosen = it; } });
return {
opens: chosen.opens,
needs: items.map(function (it) {
var on = it.k === cur;
return {
title: it.title,
gives: it.gives,
mark: on ? '✓' : '',
on: on ? 'true' : 'false',
ring: on ? '#0A3B46' : '#FFFFFF',
dot: on ? '#0A3B46' : '#EEF3F3',
dotFg: on ? '#FFFFFF' : '#45626A',
pick: function () { self.setState({ need: it.k }); }
};
})
};
}
}
</script>
</body>
</html>
